backend:
  name: github
  repo: engnajeebalwan-oss/Eng-najeeb-alwan-alfurasy
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: ar
site_url: https://engnajeeb.netlify.app
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "إدارة الموقع"
    files:
      - name: "main"
        label: "المحتوى الرئيسي"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "الاسم المهني", name: "name", widget: "string" }
          - { label: "عنوان الموقع", name: "site_title", widget: "string", required: false }
          - { label: "الصورة الشخصية", name: "personal_image", widget: "image", required: false }
          - { label: "الشعار الهندسي", name: "engineering_logo", widget: "image", required: false }
          - { label: "العبارة التعريفية", name: "eyebrow", widget: "string", required: false }
          - { label: "نبذة الواجهة الرئيسية", name: "hero_intro", widget: "text", required: false }
          - { label: "الموقع الجغرافي", name: "location", widget: "string", required: false }

          - label: "النبذة المهنية"
            name: "about"
            widget: "object"
            required: false
            fields:
              - { label: "عنوان النبذة", name: "heading", widget: "string", required: false }
              - { label: "ملخص النبذة", name: "summary", widget: "text", required: false }
              - { label: "التوجه المهني", name: "focus", widget: "text", required: false }

          - label: "المؤهلات العلمية"
            name: "education"
            widget: "object"
            required: false
            fields:
              - { label: "المؤهل", name: "degree", widget: "string", required: false }
              - { label: "الجامعة", name: "university", widget: "string", required: false }
              - { label: "سنة التخرج", name: "graduation_year", widget: "string", required: false }
              - { label: "التقدير", name: "grade", widget: "string", required: false }

          - label: "الخدمات الهندسية"
            name: "services"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "الأيقونة", name: "icon", widget: "string", required: false }
              - { label: "اسم الخدمة", name: "title", widget: "string" }
              - { label: "وصف الخدمة", name: "description", widget: "text", required: false }

          - label: "المشاريع والأعمال"
            name: "projects"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "اسم المشروع", name: "title", widget: "string" }
              - { label: "نوع العمل", name: "category", widget: "string", required: false }
              - { label: "وصف المشروع", name: "description", widget: "text", required: false }
              - { label: "صورة الغلاف", name: "image", widget: "image", required: false }
              - label: "معرض الصور"
                name: "gallery"
                widget: "list"
                required: false
                fields:
                  - { label: "الصورة", name: "image", widget: "image" }
                  - { label: "وصف الصورة", name: "caption", widget: "string", required: false }
              - label: "ملفات PDF"
                name: "pdf_files"
                widget: "list"
                required: false
                field:
                  label: "ملف PDF"
                  name: "file"
                  widget: "file"
                  media_folder: "files/projects/pdf"
                  public_folder: "/content/files/projects/pdf"
              - label: "معاينات CAD بصيغة PDF"
                name: "cad_preview_files"
                widget: "list"
                required: false
                field:
                  label: "ملف المعاينة"
                  name: "file"
                  widget: "file"
                  media_folder: "files/projects/cad-previews"
                  public_folder: "/content/files/projects/cad-previews"
              - label: "ملفات AutoCAD الأصلية DWG وDXF"
                name: "cad_files"
                widget: "list"
                required: false
                field:
                  label: "ملف AutoCAD"
                  name: "file"
                  widget: "file"
                  media_folder: "files/projects/cad"
                  public_folder: "/content/files/projects/cad"

          - label: "البرامج الهندسية"
            name: "software"
            widget: "list"
            required: false
            field:
              label: "اسم البرنامج"
              name: "software_name"
              widget: "string"

          - label: "بيانات التواصل"
            name: "contact"
            widget: "object"
            required: false
            fields:
              - { label: "البريد الإلكتروني", name: "email", widget: "string", required: false }
              - label: "أرقام الهاتف (+ للإضافة و - للحذف)"
                name: "phone_numbers"
                widget: "list"
                required: false
                field: { label: "رقم الهاتف", name: "number", widget: "string" }
              - label: "أرقام واتساب"
                name: "whatsapp_numbers"
                widget: "list"
                required: false
                field: { label: "رقم واتساب مع مفتاح الدولة", name: "number", widget: "string" }
              - { label: "رقم الهاتف القديم للتوافق", name: "phone_display", widget: "string", required: false }
              - { label: "رقم واتساب القديم للتوافق", name: "whatsapp_number", widget: "string", required: false }

          - label: "روابط التواصل والمنصات"
            name: "social_links"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "اسم المنصة", name: "platform", widget: "string", required: false }
              - { label: "النص الظاهر", name: "label", widget: "string", required: false }
              - { label: "الرابط الكامل", name: "url", widget: "string", required: false }

          - label: "مشاركة رابط الموقع"
            name: "site_sharing"
            widget: "object"
            required: false
            fields:
              - { label: "إظهار المشاركة للزوار", name: "enabled", widget: "boolean", required: false, default: true }
              - { label: "العبارة المصاحبة للرابط", name: "message", widget: "text", required: false }

          - label: "إظهار وإخفاء أقسام الموقع"
            name: "section_visibility"
            widget: "object"
            required: false
            fields:
              - { label: "النبذة المهنية", name: "about", widget: "boolean", required: false, default: true }
              - { label: "الخدمات", name: "services", widget: "boolean", required: false, default: true }
              - { label: "المشاريع", name: "portfolio", widget: "boolean", required: false, default: true }
              - { label: "البرامج", name: "tools", widget: "boolean", required: false, default: true }
              - { label: "التواصل", name: "contact", widget: "boolean", required: false, default: true }
              - { label: "الروابط الاجتماعية", name: "social", widget: "boolean", required: false, default: true }

          - label: "أقسام تعريفية إضافية"
            name: "extra_sections"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "عنوان القسم", name: "title", widget: "string" }
              - { label: "محتوى القسم", name: "body", widget: "text", required: false }
