backend:
  name: github
  repo: engnajeebalwan-oss/Eng-najeeb-alwan-alfurasy
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: ar
site_url: https://engnajeeb.netlify.app
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "محتوى الموقع"
    files:
      - name: "main"
        label: "البيانات الرئيسية"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "الاسم المهني", name: "name", widget: "string" }
          - { label: "عنوان الموقع", name: "site_title", widget: "string" }
          - { label: "العبارة التعريفية", name: "eyebrow", widget: "string" }
          - { label: "نبذة الواجهة الرئيسية", name: "hero_intro", widget: "text" }
          - { label: "الموقع الجغرافي", name: "location", widget: "string" }
          - { label: "عنوان النبذة المهنية", name: "about_heading", widget: "string" }
          - { label: "ملخص النبذة المهنية", name: "about_summary", widget: "text" }
          - { label: "التوجه المهني", name: "about_focus", widget: "text" }
          - label: "المؤهلات العلمية"
            name: "education"
            widget: "object"
            fields:
              - { label: "المؤهل", name: "degree", widget: "string" }
              - { label: "الجامعة", name: "university", widget: "string" }
              - { label: "سنة التخرج", name: "graduation_year", widget: "string" }
              - { label: "التقدير", name: "grade", widget: "string" }
          - label: "الخدمات الهندسية"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "الرمز", name: "icon", widget: "string", required: false }
              - { label: "اسم الخدمة", name: "title", widget: "string" }
              - { label: "وصف الخدمة", name: "description", widget: "text" }
          - label: "المشاريع والأعمال"
            name: "projects"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "اسم المشروع أو العمل", name: "title", widget: "string" }
              - { label: "نوع العمل", name: "category", widget: "string", required: false }
              - { label: "وصف مختصر", name: "description", widget: "text", required: false }
              - { label: "صورة المشروع", name: "image", widget: "image", required: false }
              - { label: "ملف PDF للمشروع", name: "pdf_file", widget: "file", required: false, media_folder: "files/projects", public_folder: "/files/projects" }
- { label: "ملف AutoCAD (DWG أو DXF)", name: "cad_file", widget: "file", required: false, media_folder: "files/projects", public_folder: "/files/projects" }
          - label: "البرامج الهندسية"
            name: "software"
            widget: "list"
            field: { label: "اسم البرنامج", name: "software_name", widget: "string" }
          - label: "بيانات التواصل"
            name: "contact"
            widget: "object"
            fields:
              - { label: "رقم الهاتف للعرض", name: "phone_display", widget: "string" }
              - { label: "رقم واتساب مع مفتاح الدولة دون + أو مسافات", name: "whatsapp_number", widget: "string" }
              - { label: "البريد الإلكتروني", name: "email", widget: "string" }
              - { label: "رابط صفحة فيسبوك", name: "facebook_url", widget: "string" }
