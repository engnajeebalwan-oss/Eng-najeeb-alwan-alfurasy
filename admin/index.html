<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#142536">
  <title>إدارة الموقع | المهندس نجيب الفراصي</title>
  <style>
    /* تنبيه مساعد يظهر داخل لوحة الإدارة عند فتح منتقي الصور */
    #image-picker-note {
      position: fixed;
      z-index: 2147483000;
      right: 16px;
      bottom: 16px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 10px 14px;
      border-radius: 9px;
      background: #142536;
      color: #fff;
      box-shadow: 0 4px 18px #0004;
      font: 13px/1.7 Tahoma, Arial, sans-serif;
      display: none;
    }
    #image-picker-note strong { color: #f0c66b; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <div id="image-picker-note" role="status" aria-live="polite">
    <strong>اختيار صورة:</strong>
    من نافذة أندرويد يمكنك اختيار الصور من المعرض، أو فتح «جاري التصفح» للوصول إلى الملفات الموجودة في ذاكرة الهاتف.
  </div>
  <script>
  (function () {
    'use strict';

    /*
      لا نستبدل آلية رفع Decap ولا نتجاوزها.
      نوسّع أنواع الملفات المقبولة في مدخلات الصور لتشمل امتدادات الصور
      الشائعة صراحةً، مع الإبقاء على تحقق Decap ورفع الملفات إلى GitHub.
      هذا تعديل محافظ؛ لا يخزن الصور داخل JSON ولا يغير حقول CMS.
    */
    var imageAccept =
      'image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp,.tif,.tiff,.avif,.heic,.heif,.svg';

    var note = document.getElementById('image-picker-note');
    var noteTimer = null;

    function isImageInput(input) {
      if (!input || input.type !== 'file') return false;
      var accept = (input.getAttribute('accept') || '').toLowerCase();
      return accept.indexOf('image') !== -1 ||
             /\.(jpe?g|png|gif|webp|bmp|tiff?|avif|heic|heif|svg)/i.test(accept);
    }

    function enhanceImageInputs(root) {
      var scope = root && root.querySelectorAll ? root : document;
      var inputs = scope.querySelectorAll('input[type="file"]');
      Array.prototype.forEach.call(inputs, function (input) {
        if (!isImageInput(input)) return;
        if (input.dataset.imagePickerEnhanced === 'true') return;
        input.dataset.imagePickerEnhanced = 'true';
        input.setAttribute('accept', imageAccept);
      });
    }

    function showNote() {
      if (!note) return;
      note.style.display = 'block';
      if (noteTimer) window.clearTimeout(noteTimer);
      noteTimer = window.setTimeout(function () {
        note.style.display = 'none';
      }, 6500);
    }

    document.addEventListener('click', function (event) {
      var target = event.target;
      if (!target || !target.closest) return;
      var clickable = target.closest('button,[role="button"],label');
      if (!clickable) return;

      var text = (clickable.innerText || clickable.getAttribute('aria-label') || '').trim();
      if (/upload|رفع|choose image|اختيار صورة|استبدال الصورة|إضافة صورة/i.test(text)) {
        window.setTimeout(function () {
          enhanceImageInputs(document);
          showNote();
        }, 0);
      }
    }, true);

    var observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        Array.prototype.forEach.call(mutation.addedNodes, function (node) {
          if (node.nodeType === 1) enhanceImageInputs(node);
        });
      });
      enhanceImageInputs(document);
    });

    observer.observe(document.documentElement, {
      childList: true,
      subtree: true
    });

    enhanceImageInputs(document);
  })();
  </script>
</body>
</html>
