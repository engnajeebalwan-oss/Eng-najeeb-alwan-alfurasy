<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#142536">
  <title>لوحة التحكم | إدارة المحتوى والمشاريع</title>
  <style>
    /* تحسين توافق لوحة التحكم مع الهاتف المحمول */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    #mobile-picker-tip {
      position: fixed;
      z-index: 2147483000;
      right: 16px;
      bottom: 16px;
      max-width: min(340px, calc(100vw - 32px));
      padding: 10px 14px;
      border-radius: 8px;
      background: #142536;
      color: #fff;
      font-size: 13px;
      line-height: 1.6;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: none;
    }
  </style>
</head>
<body>
  <div id="mobile-picker-tip">يمكنك اختيار الصور والملفات مباشرة من ذاكرة الهاتف أو معرض الصور.</div>

  <!-- Decap CMS Core -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>

  <script>
    // ترويض مدخلات الملفات لتسمح بالتقاط واختيار الملفات من معرض الهاتف بدون احتجاز على الكاميرا
    document.addEventListener('change', function(e) {
      if (e.target && e.target.type === 'file') {
        e.target.removeAttribute('capture');
      }
    }, true);

    // مراقبة النقر على زر الرفع لتنبيه المستخدم
    document.addEventListener('click', function (event) {
      var input = event.target;
      if (input && input.tagName === 'INPUT' && input.type === 'file') {
        var tip = document.getElementById('mobile-picker-tip');
        tip.style.display = 'block';
        setTimeout(function () { tip.style.display = 'none'; }, 4000);
      }
    }, true);
  </script>
</body>
</html>
