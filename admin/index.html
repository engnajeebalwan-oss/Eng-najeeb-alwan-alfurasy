<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#142536">
  <title>إدارة الموقع | المهندس نجيب الفراصي</title>
  <style>
    #image-picker-note {
      position: fixed;
      z-index: 2147483000;
      right: 16px;
      bottom: 16px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 10px 14px;
      border-radius: 9px;
      background: #142536;
      color: #fff;
      box-shadow: 0 4px 18px #0004;
      font: 13px/1.7 Tahoma, Arial, sans-serif;
      display: none;
    }
    #image-picker-note strong { color: #f0c66b; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <div id="image-picker-note" role="status" aria-live="polite">
    <strong>اختيار صورة:</strong>
    في مكتبة الوسائط اختر «رفع» للوصول إلى خيارات الصور والملفات التي يتيحها جهازك.
  </div>

  <script>
  (function () {
    'use strict';
    var note = document.getElementById('image-picker-note');
    var noteTimer = null;

    document.addEventListener('click', function (event) {
      var input = event.target;
      if (!input || input.tagName !== 'INPUT' || input.type !== 'file') return;
      var accept = (input.getAttribute('accept') || '').toLowerCase();
      if (accept.indexOf('image/') === -1 && !/\.(jpe?g|png|gif|webp|bmp|tiff?|avif|heic|heif|svg)/i.test(accept)) return;
      note.style.display = 'block';
      if (noteTimer) window.clearTimeout(noteTimer);
      noteTimer = window.setTimeout(function () {
        note.style.display = 'none';
      }, 6500);
    }, true);
  })();
  </script>
</body>
</html>
